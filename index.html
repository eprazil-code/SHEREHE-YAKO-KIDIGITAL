<!DOCTYPE html>
<html lang="sw" x-data="eventApp()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Event Platform Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#fdf4ff', 100: '#fae8ff', 500: '#d946ef', 600: '#c026d3', 700: '#a21caf', 800: '#86198f', 900: '#701a75' }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js & QRCode Library -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- 1. UKURASA WA KWANZA: KUJISAJILI KAMA MHUSIKA -->
    <div x-show="!isLoggedIn" x-cloak class="fixed inset-0 bg-gradient-to-br from-purple-900 via-slate-900 to-indigo-950 flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white/95 backdrop-blur-md rounded-3xl max-w-md w-full p-6 md:p-8 shadow-2xl space-y-5 border border-white/20 my-auto">
            <div class="text-center">
                <div class="w-14 h-14 bg-purple-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg">
                    <i class="fa-solid fa-calendar-star text-2xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900">Digital Event Platform</h1>
                <p class="text-xs text-slate-500 mt-1" x-text="lang === 'sw' ? 'Karibu! Jisajili kama Mhusika wa Sherehe.' : 'Welcome! Register your role.'"></p>
            </div>

            <!-- Language Switcher -->
            <div class="flex justify-center">
                <div class="bg-slate-100 p-1 rounded-xl flex text-xs font-semibold">
                    <button @click="lang = 'sw'" :class="lang === 'sw' ? 'bg-white text-purple-700 shadow-sm' : 'text-slate-500'" class="px-4 py-1.5 rounded-lg transition">Kiswahili</button>
                    <button @click="lang = 'en'" :class="lang === 'en' ? 'bg-white text-purple-700 shadow-sm' : 'text-slate-500'" class="px-4 py-1.5 rounded-lg transition">English</button>
                </div>
            </div>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 mb-1" x-text="lang === 'sw' ? 'Jina Lako Kamili:' : 'Full Name:'"></label>
                    <input type="text" x-model="authForm.name" placeholder="Ingiza jina lako" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-purple-600 focus:outline-none">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1" x-text="lang === 'sw' ? 'Namba ya Simu ya WhatsApp:' : 'WhatsApp Phone Number:'"></label>
                    <input type="text" x-model="authForm.phone" placeholder="Mf. 0712345678" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-purple-600 focus:outline-none">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1" x-text="lang === 'sw' ? 'Chagua Mhusika / Nafasi Yako:' : 'Select Your Role:'"></label>
                    <select x-model="authForm.role" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-semibold focus:ring-2 focus:ring-purple-600 focus:outline-none">
                        <option value="bwana_harusi">Bwana Harusi (Groom)</option>
                        <option value="bibi_harusi">Bibi Harusi (Bride)</option>
                        <option value="mwenyekiti">Mwenyekiti wa Sherehe (Chairman)</option>
                        <option value="katibu">Katibu wa Sherehe (Secretary)</option>
                        <option value="mweka_hazina">Mweka Hazina (Treasurer)</option>
                        <option value="mwanakamati">Mwanakamati (Committee Member)</option>
                        <option value="mgeni">Mgeni Mwalikwa (Guest)</option>
                    </select>
                </div>

                <button @click="handleRegister" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-xl font-bold text-sm shadow-lg transition cursor-pointer mt-2" x-text="lang === 'sw' ? 'Ingia Kwenye Mfumo' : 'Register & Continue'"></button>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40" x-show="isLoggedIn" x-cloak>
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-purple-600 text-white p-2 rounded-xl shadow-md">
                    <i class="fa-solid fa-calendar-star text-xl"></i>
                </div>
                <div>
                    <span class="text-lg font-bold bg-gradient-to-r from-purple-700 to-indigo-600 bg-clip-text text-transparent">Digital Event Hub</span>
                    <span class="block text-[10px] text-slate-400 font-medium tracking-wider uppercase" x-text="lang === 'sw' ? 'Usimamizi wa Sherehe' : 'Event Workspace'"></span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <div class="bg-slate-100 p-1 rounded-lg flex text-xs font-semibold">
                    <button @click="lang = 'sw'" :class="lang === 'sw' ? 'bg-white text-purple-700 shadow-sm' : 'text-slate-500'" class="px-3 py-1.5 rounded-md transition">Swahili</button>
                    <button @click="lang = 'en'" :class="lang === 'en' ? 'bg-white text-purple-700 shadow-sm' : 'text-slate-500'" class="px-3 py-1.5 rounded-md transition">English</button>
                </div>

                <div class="bg-purple-50 border border-purple-200 text-purple-800 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-2">
                    <i class="fa-solid fa-user-circle"></i>
                    <span x-text="authForm.name"></span>
                    <span class="bg-purple-200 text-purple-900 px-2 py-0.5 rounded text-[10px] uppercase" x-text="authForm.role"></span>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN WORKSPACE -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-4 gap-6" x-show="isLoggedIn" x-cloak>

        <!-- SIDEBAR -->
        <aside class="md:col-span-1 space-y-4">
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400" x-text="lang === 'sw' ? 'Sherehe Zangu' : 'My Events'"></h3>
                    <button @click="openWizard = true" class="text-purple-600 hover:text-purple-800 text-xs font-bold flex items-center gap-1 bg-purple-50 px-2.5 py-1 rounded-lg cursor-pointer">
                        <i class="fa-solid fa-plus"></i> <span x-text="lang === 'sw' ? 'Anzisha' : 'Create'"></span>
                    </button>
                </div>
                
                <div class="space-y-2">
                    <template x-if="events.length === 0">
                        <p class="text-xs text-slate-400 text-center py-4" x-text="lang === 'sw' ? 'Hujaanzisha sherehe. Bonyeza Anzisha.' : 'No active events.'"></p>
                    </template>
                    <template x-for="ev in events" :key="ev.id">
                        <div @click="activeEventId = ev.id" 
                             :class="activeEventId === ev.id ? 'border-purple-600 bg-purple-50/50 ring-1 ring-purple-600' : 'border-slate-200 hover:border-slate-300 bg-white'"
                             class="p-3 rounded-xl border cursor-pointer transition shadow-2xs">
                            <div class="flex items-center justify-between">
                                <span class="font-bold text-sm text-slate-800" x-text="ev.name"></span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full font-medium bg-purple-100 text-purple-700" x-text="ev.type"></span>
                            </div>
                            <div class="mt-2 text-xs text-slate-500">
                                <span><i class="fa-solid fa-calendar-days mr-1"></i> <span x-text="ev.date"></span></span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 p-3 shadow-sm">
                <nav class="space-y-1 text-sm font-medium">
                    <button @click="currentTab = 'chat'" :class="currentTab === 'chat' ? 'bg-purple-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl transition cursor-pointer">
                        <i class="fa-solid fa-comments w-5"></i>
                        <span x-text="lang === 'sw' ? 'Kikundi cha Ndani (WhatsApp Style)' : 'Internal Chat & Ahadi'"></span>
                    </button>
                    <button @click="currentTab = 'cards'" :class="currentTab === 'cards' ? 'bg-purple-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl transition cursor-pointer">
                        <i class="fa-solid fa-wand-magic-sparkles w-5"></i>
                        <span x-text="lang === 'sw' ? 'AI Card Generator & QR' : 'AI Cards & QR'"></span>
                    </button>
                    <button @click="currentTab = 'finance'" :class="currentTab === 'finance' ? 'bg-purple-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl transition cursor-pointer">
                        <i class="fa-solid fa-wallet w-5"></i>
                        <span x-text="lang === 'sw' ? 'Bajeti, Familia & Michango' : 'Budget & Family Fund'"></span>
                    </button>
                    <button @click="currentTab = 'gate'" :class="currentTab === 'gate' ? 'bg-purple-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl transition cursor-pointer">
                        <i class="fa-solid fa-qrcode w-5"></i>
                        <span x-text="lang === 'sw' ? 'Uhakiki wa Lango (QR)' : 'Gate Check-In'"></span>
                    </button>
                </nav>
            </div>
        </aside>

        <!-- CONTENT AREA -->
        <section class="md:col-span-3 space-y-6">

            <template x-if="!activeEvent">
                <div class="bg-white p-8 rounded-3xl border border-slate-200 text-center space-y-4">
                    <i class="fa-solid fa-calendar-plus text-4xl text-purple-600"></i>
                    <h2 class="text-xl font-bold" x-text="lang === 'sw' ? 'Hakuna Sherehe Iliyochaguliwa' : 'No Event Selected'"></h2>
                    <button @click="openWizard = true" class="bg-purple-600 text-white px-6 py-2.5 rounded-xl font-bold text-xs shadow-md" x-text="lang === 'sw' ? 'Anzisha Sherehe Mpya' : 'Create Event Now'"></button>
                </div>
            </template>

            <template x-if="activeEvent">
                <div class="space-y-6">

                    <!-- TAB 1: INTERNAL WHATSAPP-STYLE GROUP CHAT & PLEDGES -->
                    <div x-show="currentTab === 'chat'" x-cloak class="space-y-4">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                            <div>
                                <h2 class="text-base font-bold text-slate-800" x-text="activeEvent.name + ' - Kikundi cha Kamati'"></h2>
                                <p class="text-xs text-slate-500" x-text="lang === 'sw' ? 'Wanakamati wanaona ahadi na kufanya mazungumzo kama WhatsApp.' : 'Committee internal group chat with pledge tracking.'"></p>
                            </div>
                            <button @click="openPledgeModal = true" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 cursor-pointer shadow-sm">
                                <i class="fa-solid fa-hand-holding-dollar text-sm"></i> <span x-text="lang === 'sw' ? 'Weka Ahadi Yako' : 'Add My Pledge'"></span>
                            </button>
                        </div>

                        <!-- Grid: Chat & Pledges Sidebar -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <!-- Chat Box (2 cols) -->
                            <div class="md:col-span-2 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-col justify-between h-[450px]">
                                <div class="border-b pb-2 flex justify-between items-center text-xs font-bold text-slate-600">
                                    <span><i class="fa-solid fa-users text-purple-600 mr-1"></i> Group Chat Active</span>
                                    <span class="text-emerald-600">Online</span>
                                </div>
                                <div class="flex-1 overflow-y-auto space-y-3 py-3 text-xs">
                                    <template x-for="msg in chatMessages" :key="msg.id">
                                        <div :class="msg.sender === authForm.name ? 'bg-purple-600 text-white ml-auto' : 'bg-slate-100 text-slate-800'" class="p-3 rounded-2xl max-w-[85%] space-y-1 shadow-2xs">
                                            <div class="flex justify-between items-center gap-2 text-[10px] opacity-80">
                                                <span class="font-bold" x-text="msg.sender"></span>
                                                <span x-text="msg.time"></span>
                                            </div>
                                            <p class="text-xs" x-text="msg.text"></p>
                                        </div>
                                    </template>
                                </div>
                                <div class="pt-2 border-t flex items-center space-x-2">
                                    <input type="text" x-model="newMessageText" @keydown.enter="sendChatMessage" placeholder="Andika ujumbe au ahadi..." class="flex-1 bg-slate-100 border-0 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-purple-600 focus:outline-none">
                                    <button @click="sendChatMessage" class="bg-purple-600 text-white px-4 py-2 rounded-xl text-xs font-bold cursor-pointer">
                                        <i class="fa-solid fa-paper-plane"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Ahadi za Wanakamati (1 col) -->
                            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-3">
                                <h4 class="font-bold text-slate-800 text-xs uppercase tracking-wider text-purple-700" x-text="lang === 'sw' ? 'Ahadi za Wanakamati' : 'Committee Pledges'"></h4>
                                <div class="space-y-2 max-h-[380px] overflow-y-auto text-xs">
                                    <template x-if="pledges.length === 0">
                                        <p class="text-xs text-slate-400 text-center py-6" x-text="lang === 'sw' ? 'Bado hakuna ahadi zilizowekwa.' : 'No pledges recorded yet.'"></p>
                                    </template>
                                    <template x-for="p in pledges" :key="p.id">
                                        <div class="p-2.5 bg-slate-50 rounded-xl border border-slate-100 flex justify-between items-center">
                                            <div>
                                                <p class="font-bold text-slate-800" x-text="p.name"></p>
                                                <span class="text-[10px] text-purple-600 font-semibold" x-text="p.note"></span>
                                            </div>
                                            <span class="font-extrabold text-emerald-700 text-xs" x-text="'TSh ' + Number(p.amount).toLocaleString()"></span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 2: AI CARD GENERATOR & QR CODES -->
                    <div x-show="currentTab === 'cards'" x-cloak class="space-y-6">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
                            <div>
                                <h2 class="text-base font-bold text-slate-800" x-text="lang === 'sw' ? 'Gemini AI Card Generator & QR Code' : 'AI Card Generator'"></h2>
                                <p class="text-xs text-slate-500" x-text="lang === 'sw' ? 'Tengeneza kadi nzuri za graphics kupitia AI na QR code kwa ajili ya wageni.' : 'Generate stunning graphic cards with Gemini AI & QR codes.'"></p>
                            </div>
                            <button @click="generateAICard" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:opacity-90 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 cursor-pointer shadow-md">
                                <i class="fa-solid fa-wand-magic-sparkles"></i> <span x-text="lang === 'sw' ? 'Generate na AI' : 'Generate with AI'"></span>
                            </button>
                        </div>

                        <!-- Card Preview -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="rounded-3xl p-6 shadow-2xl relative overflow-hidden flex flex-col justify-between min-h-[360px] border-2 border-amber-400/40"
                                 :class="aiCardTheme">
                                <div class="flex justify-between items-center">
                                    <span class="text-[10px] bg-white/20 text-white px-3 py-1 rounded-full font-bold uppercase" x-text="activeEvent.type"></span>
                                    <span class="text-xs font-mono text-amber-200">AI-VERIFIED</span>
                                </div>

                                <div class="text-center my-4 space-y-2">
                                    <h3 class="text-2xl font-extrabold text-amber-100 font-serif" x-text="activeEvent.name"></h3>
                                    <p class="text-xs text-slate-200"><i class="fa-solid fa-location-dot mr-1"></i> <span x-text="activeEvent.venue"></span> | <i class="fa-solid fa-calendar mr-1 ml-1"></i> <span x-text="activeEvent.date"></span></p>
                                </div>

                                <div class="bg-black/40 backdrop-blur-md p-3.5 rounded-2xl border border-white/10 flex items-center justify-between text-white">
                                    <div>
                                        <span class="text-[10px] text-amber-300 uppercase font-semibold block">Mgeni Mwalikwa</span>
                                        <span class="text-sm font-bold">Juma Hassan</span>
                                        <span class="block text-[10px] text-emerald-300 font-mono">Single / Double Pass</span>
                                    </div>
                                    <div class="bg-white p-2 rounded-xl text-slate-900 font-mono text-[9px] font-bold text-center">
                                        <i class="fa-solid fa-qrcode text-2xl text-purple-900"></i>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                                <h4 class="font-bold text-slate-800 text-sm" x-text="lang === 'sw' ? 'Maelezo ya AI Prompt' : 'AI Prompt Settings'"></h4>
                                <p class="text-xs text-slate-500" x-text="lang === 'sw' ? 'AI inachambua aina ya sherehe na kuchagua rangi na muundo sahihi wa kadi bila picha za watu.' : 'AI generates pure graphic themes tailored to your event type.'"></p>
                                <div class="p-3 bg-purple-50 rounded-xl text-xs text-purple-900 font-mono">
                                    Status: Connected to Gemini AI Engine ✓
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 3: BUDGET, FAMILY FUND & CONTRIBUTIONS -->
                    <div x-show="currentTab === 'finance'" x-cloak class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                                <span class="text-slate-400 font-semibold uppercase">Target Budget</span>
                                <h3 class="text-xl font-extrabold text-purple-700" x-text="'TSh ' + Number(activeEvent.targetBudget || 0).toLocaleString()"></h3>
                            </div>
                            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                                <span class="text-slate-400 font-semibold uppercase">Mchango (Single / Double)</span>
                                <p class="text-sm font-bold text-slate-800">Single: TSh <span x-text="activeEvent.singleContrib"></span></p>
                                <p class="text-sm font-bold text-slate-800">Double: TSh <span x-text="activeEvent.doubleContrib"></span></p>
                            </div>
                            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                                <span class="text-slate-400 font-semibold uppercase">Mchango wa Familia</span>
                                <h3 class="text-xl font-extrabold text-emerald-600" x-text="'TSh ' + Number(activeEvent.familyFund || 0).toLocaleString()"></h3>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 4: GATE QR CHECK-IN -->
                    <div x-show="currentTab === 'gate'" x-cloak class="space-y-6">
                        <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                            <h2 class="text-base font-bold text-slate-800" x-text="lang === 'sw' ? 'Uhakiki wa Lango Kuu (QR Code Scan)' : 'Gate QR Verification'"></h2>
                            <button @click="alert('QR Scanner Activated!')" class="bg-purple-600 text-white font-bold py-3 px-6 rounded-xl text-xs hover:bg-purple-700 transition shadow-md cursor-pointer flex items-center justify-center gap-2">
                                <i class="fa-solid fa-camera"></i> Scan QR Code
                            </button>
                        </div>
                    </div>

                </div>
            </template>

        </section>
    </main>

    <!-- MODAL: CREATE EVENT (WITH ALL EVENT TYPES & CUSTOM INPUT) -->
    <div x-show="openWizard" x-cloak class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4 my-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-slate-800 text-base" x-text="lang === 'sw' ? 'Anzisha Sherehe Mpya' : 'Create New Event'"></h3>
                <button @click="openWizard = false" class="text-slate-400 hover:text-slate-600 cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1" x-text="lang === 'sw' ? 'Aina ya Sherehe:' : 'Event Type:'"></label>
                    <select x-model="newEvent.type" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-semibold focus:outline-none">
                        <option value="Wedding">Wedding / Harusi</option>
                        <option value="Send-off">Send-off</option>
                        <option value="Reception">Reception</option>
                        <option value="Dinner Party">Dinner Party</option>
                        <option value="Kitchen Party">Kitchen Party</option>
                        <option value="Birthday">Birthday Party</option>
                        <option value="Graduation">Graduation Ceremony</option>
                        <option value="Engagement">Engagement</option>
                        <option value="Baby Shower">Baby Shower</option>
                        <option value="Bridal Shower">Bridal Shower</option>
                        <option value="Anniversary">Anniversary</option>
                        <option value="Corporate">Corporate Event</option>
                        <option value="Conference">Conference / Meeting</option>
                        <option value="Religious">Religious Event</option>
                        <option value="Funeral">Funeral / Memorial</option>
                        <option value="Other">Nyinginezo / Other (Custom)</option>
                    </select>
                </div>

                <!-- Kama akichagua Nyinginezo -->
                <template x-if="newEvent.type === 'Other'">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1" x-text="lang === 'sw' ? 'Andika Jina la Sherehe Yako:' : 'Custom Event Name:'"></label>
                        <input type="text" x-model="newEvent.customType" placeholder="Mf. Sherehe ya Kuzaliwa Mtoto" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none">
                    </div>
                </template>

                <div>

        function eventApp() {
            return {
                lang: 'sw',
                isLoggedIn: false,
                currentTab: 'chat',
                openWizard: false,
                openPledgeModal: false,
                activeEventId: null,
                aiCardTheme: 'bg-gradient-to-tr from-slate-900 via-purple-950 to-slate-900 text-white',

                authForm: { name: '', phone: '', role: 'mwenyekiti' },
                newEvent: { name: '', type: 'Wedding', customType: '', venue: '', date: '', targetBudget: 5000000, singleContrib: 20000, doubleContrib: 40000, familyFund: 1000000 },
                newPledge: { amount: '', note: '' },
                newMessageText: '',

                events: [],
                chatMessages: [],
                pledges: [],

                handleRegister() {
                    if (!this.authForm.name || !this.authForm.phone) {
                        alert('Tafadhali jaza jina na namba ya simu!');
                        return;
                    }
                    this.isLoggedIn = true;
                },

                get activeEvent() {
                    return this.events.find(e => e.id === this.activeEventId) || null;
                },

                createNewEvent() {
                    if (!this.newEvent.name || !this.newEvent.venue || !this.newEvent.date) {
                        alert('Tafadhali jaza taarifa za sherehe!');
                        return;
                    }

                    const eventTypeName = this.newEvent.type === 'Other' ? (this.newEvent.customType || 'Sherehe Maalum') : this.newEvent.type;

                    const created = {
                        id: Date.now(),
                        name: this.newEvent.name,
                        type: eventTypeName,
                        venue: this.newEvent.venue,
                        date: this.newEvent.date,
                        targetBudget: Number(this.newEvent.targetBudget),
                        singleContrib: Number(this.newEvent.singleContrib),
                        doubleContrib: Number(this.newEvent.doubleContrib),
                        familyFund: Number(this.newEvent.familyFund)
                    };

                    this.events.push(created);
                    this.activeEventId = created.id;
                    this.openWizard = false;
                },

                sendChatMessage() {
                    if (!this.newMessageText.trim()) return;
                    const now = new Date();
                    const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                    this.chatMessages.push({ id: Date.now(), sender: this.authForm.name, text: this.newMessageText, time: timeStr });
                    this.newMessageText = '';
                },

                addPledge() {
                    if (!this.newPledge.amount) return;
                    this.pledges.push({ id: Date.now(), name: this.authForm.name, amount: this.newPledge.amount, note: this.newPledge.note || 'Ahadi mpya' });
                    this.openPledgeModal = false;
                    this.newPledge = { amount: '', note: '' };
                },

                generateAICard() {
                    const themes = [
                        'bg-gradient-to-tr from-slate-900 via-purple-950 to-slate-900 text-white',
                        'bg-gradient-to-tr from-emerald-950 via-teal-900 to-slate-900 text-white',
                        'bg-gradient-to-tr from-amber-950 via-yellow-900 to-slate-900 text-white',
                        'bg-gradient-to-tr from-rose-950 via-pink-900 to-slate-900 text-white'
                    ];
                    this.aiCardTheme = themes[Math.floor(Math.random() * themes.length)];
                    alert('Gemini AI imefanikiwa kuzalisha kadi mpya yenye graphics safi na QR code!');
                }
            }
        }
    </script>

                            </div>
                        </div>
                    </div>

                    <!-- TAB 2: AI CARD GENERATOR & QR CODES -->
                    <div x-show="currentTab === 'cards'" x-cloak class="space-y-6">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
                            <div>
                                <h2 class="text-base font-bold text-slate-800" x-text="lang === 'sw' ? 'Gemini AI Card Generator & QR Code' : 'AI Card Generator'"></h2>
                                <p class="text-xs text-slate-500" x-text="lang === 'sw' ? 'Tengeneza kadi nzuri za graphics kupitia AI na QR code kwa ajili ya wageni.' : 'Generate stunning graphic cards with Gemini AI & QR codes.'"></p>
                            </div>
                            <button @click="generateAICard" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:opacity-90 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 cursor-pointer shadow-md">
                                <i class="fa-solid fa-wand-magic-sparkles"></i> <span x-text="lang === 'sw' ? 'Generate na AI' : 'Generate with AI'"></span>
                            </button>
                        </div>

                        <!-- Card Preview -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="rounded-3xl p-6 shadow-2xl relative overflow-hidden flex flex-col justify-between min-h-[360px] border-2 border-amber-400/40"
                                 :class="aiCardTheme">
                                <div class="flex justify-between items-center">
                                    <span class="text-[10px] bg-white/20 text-white px-3 py-1 rounded-full font-bold uppercase" x-text="activeEvent.type"></span>
                                    <span class="text-xs font-mono text-amber-200">AI-VERIFIED</span>
                                </div>

                                <div class="text-center my-4 space-y-2">
                                    <h3 class="text-2xl font-extrabold text-amber-100 font-serif" x-text="activeEvent.name"></h3>
                                    <p class="text-xs text-slate-200"><i class="fa-solid fa-location-dot mr-1"></i> <span x-text="activeEvent.venue"></span> | <i class="fa-solid fa-calendar mr-1 ml-1"></i> <span x-text="activeEvent.date"></span></p>
                                </div>

                                <div class="bg-black/40 backdrop-blur-md p-3.5 rounded-2xl border border-white/10 flex items-center justify-between text-white">
                                    <div>
                                        <span class="text-[10px] text-amber-300 uppercase font-semibold block">Mgeni Mwalikwa</span>
                                        <span class="text-sm font-bold">Juma Hassan</span>
                                        <span class="block text-[10px] text-emerald-300 font-mono">Single / Double Pass</span>
                                    </div>
                                    <div class="bg-white p-2 rounded-xl text-slate-900 font-mono text-[9px] font-bold text-center">
                                        <i class="fa-solid fa-qrcode text-2xl text-purple-900"></i>
                                    </div>
                                </div>
                            </div>

                            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                                <h4 class="font-bold text-slate-800 text-sm" x-text="lang === 'sw' ? 'Maelezo ya AI Prompt' : 'AI Prompt Settings'"></h4>
                                <p class="text-xs text-slate-500" x-text="lang === 'sw' ? 'AI inachambua aina ya sherehe na kuchagua rangi na muundo sahihi wa kadi bila picha za watu.' : 'AI generates pure graphic themes tailored to your event type.'"></p>
                                <div class="p-3 bg-purple-50 rounded-xl text-xs text-purple-900 font-mono">
                                    Status: Connected to Gemini AI Engine ✓
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 3: BUDGET, FAMILY FUND & CONTRIBUTIONS -->
                    <div x-show="currentTab === 'finance'" x-cloak class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                                <span class="text-slate-400 font-semibold uppercase">Target Budget</span>
                                <h3 class="text-xl font-extrabold text-purple-700" x-text="'TSh ' + Number(activeEvent.targetBudget || 0).toLocaleString()"></h3>
                            </div>
                            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                                <span class="text-slate-400 font-semibold uppercase">Mchango (Single / Double)</span>
                                <p class="text-sm font-bold text-slate-800">Single: TSh <span x-text="activeEvent.singleContrib"></span></p>
                                <p class="text-sm font-bold text-slate-800">Double: TSh <span x-text="activeEvent.doubleContrib"></span></p>
                            </div>
                            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                                <span class="text-slate-400 font-semibold uppercase">Mchango wa Familia</span>
                                <h3 class="text-xl font-extrabold text-emerald-600" x-text="'TSh ' + Number(activeEvent.familyFund || 0).toLocaleString()"></h3>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 4: GATE QR CHECK-IN -->
                    <div x-show="currentTab === 'gate'" x-cloak class="space-y-6">
                        <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                            <h2 class="text-base font-bold text-slate-800" x-text="lang === 'sw' ? 'Uhakiki wa Lango Kuu (QR Code Scan)' : 'Gate QR Verification'"></h2>
                            <button @click="alert('QR Scanner Activated!')" class="bg-purple-600 text-white font-bold py-3 px-6 rounded-xl text-xs hover:bg-purple-700 transition shadow-md cursor-pointer flex items-center justify-center gap-2">
                                <i class="fa-solid fa-camera"></i> Scan QR Code
                            </button>
                        </div>
                    </div>

                </div>
            </template>

        </section>
    </main>

    <!-- MODAL: CREATE EVENT (WITH ALL EVENT TYPES & CUSTOM INPUT) -->
    <div x-show="openWizard" x-cloak class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4 my-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-slate-800 text-base" x-text="lang === 'sw' ? 'Anzisha Sherehe Mpya' : 'Create New Event'"></h3>
                <button @click="openWizard = false" class="text-slate-400 hover:text-slate-600 cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1" x-text="lang === 'sw' ? 'Aina ya Sherehe:' : 'Event Type:'"></label>
                    <select x-model="newEvent.type" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-semibold focus:outline-none">
                        <option value="Wedding">Wedding / Harusi</option>
                        <option value="Send-off">Send-off</option>
                        <option value="Reception">Reception</option>
                        <option value="Dinner Party">Dinner Party</option>
                        <option value="Kitchen Party">Kitchen Party</option>
                        <option value="Birthday">Birthday Party</option>
                        <option value="Graduation">Graduation Ceremony</option>
                        <option value="Engagement">Engagement</option>
                        <option value="Baby Shower">Baby Shower</option>
                        <option value="Bridal Shower">Bridal Shower</option>
                        <option value="Anniversary">Anniversary</option>
                        <option value="Corporate">Corporate Event</option>
                        <option value="Conference">Conference / Meeting</option>
                        <option value="Religious">Religious Event</option>
                        <option value="Funeral">Funeral / Memorial</option>
                        <option value="Other">Nyinginezo / Other (Custom)</option>
                    </select>
                </div>

                <!-- Kama akichagua Nyinginezo -->
                <template x-if="newEvent.type === 'Other'">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1" x-text="lang === 'sw' ? 'Andika Jina la Sherehe Yako:' : 'Custom Event Name:'"></label>
                        <input type="text" x-model="newEvent.customType" placeholder="Mf. Sherehe ya Kuzaliwa Mtoto" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none">
                    </div>
                </template>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1" x-text="lang === 'sw' ? 'Jina la Sherehe:' : 'Event Title:'"></label>
                    <input type="text" x-model="newEvent.name" placeholder="Mf. Harusi ya John na Mary" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1" x-text="lang === 'sw' ? 'Ukumbi / Eneo:' : 'Venue:'"></label>
                        <input type="text" x-model="newEvent.venue" placeholder="Eneo la sherehe" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1" x-text="lang === 'sw' ? 'Tarehe:' : 'Date:'"></label>
                        <input type="date" x-model="newEvent.date" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1" x-text="lang === 'sw' ? 'Target Budget (TSh):' : 'Target Budget:'"></label>
                        <input type="number" x-model="newEvent.targetBudget" placeholder="5000000" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1" x-text="lang === 'sw' ? 'Mchango Single (TSh):' : 'Single Contribution:'"></label>
                        <input type="number" x-model="newEvent.singleContrib" placeholder="20000" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1" x-text="lang === 'sw' ? 'Mchango Double (TSh):' : 'Double Contribution:'"></label>
                        <input type="number" x-model="newEvent.doubleContrib" placeholder="40000" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1" x-text="lang === 'sw' ? 'Mchango wa Familia (TSh):' : 'Family Fund (TSh):'"></label>
                    <input type="number" x-model="newEvent.familyFund" placeholder="1000000" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none">
                </div>
            </div>

            <div class="pt-3 border-t flex justify-end space-x-2">
                <button @click="openWizard = false" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100 cursor-pointer">Ghairi</button>
                <button @click="createNewEvent" class="bg-purple-600 text-white px-5 py-2 rounded-xl text-xs font-bold hover:bg-purple-700 transition cursor-pointer" x-text="lang === 'sw' ? 'Hifadhi & Anzisha' : 'Save & Publish'"></button>
            </div>
        </div>
    </div>

    <!-- MODAL: ADD PLEDGE -->
    <div x-show="openPledgeModal" x-cloak class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-slate-800 text-base" x-text="lang === 'sw' ? 'Weka Ahadi Yako' : 'Add Pledge'"></h3>
                <button @click="openPledgeModal = false" class="text-slate-400 hover:text-slate-600 cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Kiasi cha Ahadi (TSh):</label>
                    <input type="number" x-model="newPledge.amount" placeholder="50000" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Maelezo / Ujumbe:</label>
                    <input type="text" x-model="newPledge.note" placeholder="Nitatoa tarehe fulani" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 focus:outline-none">
                </div>
            </div>
            <div class="pt-3 border-t flex justify-end space-x-2">
                <button @click="openPledgeModal = false" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-100 cursor-pointer">Ghairi</button>
                <button @click="addPledge" class="bg-purple-600 text-white px-5 py-2 rounded-xl text-xs font-bold hover:bg-purple-700 cursor-pointer">Weka Ahadi</button>
            </div>
        </div>
    </div>

    <!-- ALPINE LOGIC -->
    <script>
        function eventApp() {
            return {
                lang: 'sw',
                isLoggedIn: false,
                currentTab: 'chat',
                openWizard: false,
                openPledgeModal: false,
                activeEventId: null,
                aiCardTheme: 'bg-gradient-to-tr from-slate-900 via-purple-950 to-slate-900 text-white',

                authForm: { name: '', phone: '', role: 'mwenyekiti' },
                newEvent: { name: '', type: 'Wedding', customType: '', venue: '', date: '', targetBudget: 5000000, singleContrib: 20000, doubleContrib: 40000, familyFund: 1000000 },
                newPledge: { amount: '', note: '' },
                newMessageText: '',

                events: [],
                chatMessages: [],
                pledges: [],

                handleRegister() {
                    if (!this.authForm.name || !this.authForm.phone) {
                        alert('Tafadhali jaza jina na namba ya simu!');
                        return;
                    }
                    this.isLoggedIn = true;
                },

                get activeEvent() {
                    return this.events.find(e => e.id === this.activeEventId) || null;
                },

                createNewEvent() {
                    if (!this.newEvent.name || !this.newEvent.venue || !this.newEvent.date) {
                        alert('Tafadhali jaza taarifa za sherehe!');
                        return;
                    }

                    const eventTypeName = this.newEvent.type === 'Other' ? (this.newEvent.customType || 'Sherehe Maalum') : this.newEvent.type;

                    const created = {
                        id: Date.now(),
                        name: this.newEvent.name,
                        type: eventTypeName,
                        venue: this.newEvent.venue,
                        date: this.newEvent.date,
                        targetBudget: Number(this.newEvent.targetBudget),
                        singleContrib: Number(this.newEvent.singleContrib),
                        doubleContrib: Number(this.newEvent.doubleContrib),
                        familyFund: Number(this.newEvent.familyFund)
                    };

                    this.events.push(created);
                    this.activeEventId = created.id;
                    this.openWizard = false;
                },

                sendChatMessage() {
                    if (!this.newMessageText.trim()) return;
                    const now = new Date();
                    const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                    this.chatMessages.push({ id: Date.now(), sender: this.authForm.name, text: this.newMessageText, time: timeStr });
                    this.newMessageText = '';
                },

                addPledge() {
                    if (!this.newPledge.amount) return;
                    this.pledges.push({ id: Date.now(), name: this.authForm.name, amount: this.newPledge.amount, note: this.newPledge.note || 'Ahadi mpya' });
                    this.openPledgeModal = false;
                    this.newPledge = { amount: '', note: '' };
                },

                generateAICard() {
                    const themes = [
                        'bg-gradient-to-tr from-slate-900 via-purple-950 to-slate-900 text-white',
                        'bg-gradient-to-tr from-emerald-950 via-teal-900 to-slate-900 text-white',
                        'bg-gradient-to-tr from-amber-950 via-yellow-900 to-slate-900 text-white',
                        'bg-gradient-to-tr from-rose-950 via-pink-900 to-slate-900 text-white'
                    ];
                    this.aiCardTheme = themes[Math.floor(Math.random() * themes.length)];
                    alert('Gemini AI imefanikiwa kuzalisha kadi mpya yenye graphics safi na QR code!');
                }
            }
        }
    </script>
</body>
