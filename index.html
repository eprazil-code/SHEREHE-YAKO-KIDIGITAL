<!DOCTYPE html>
<html lang="sw" x-data="shereheApp()" x-init="init()" x-cloak>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>SHEREHE YAKO KIDIGITAL — Digital Event Operating System</title>

  <!-- Tailwind CSS & CDN Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50:'#fff7ed',100:'#ffedd5',200:'#fed7aa',300:'#fdba74',
              400:'#fb923c',500:'#f97316',600:'#ea580c',700:'#c2410c',
              800:'#9a3412',900:'#7c2d12'
            }
          },
          boxShadow: {
            soft: '0 10px 35px rgba(15,23,42,.08)'
          }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    [x-cloak]{display:none!important}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .scrollbar::-webkit-scrollbar{width:7px;height:7px}
    .scrollbar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:999px}
    .scrollbar::-webkit-scrollbar-track{background:transparent}
    .gradient-brand{background:linear-gradient(135deg,#f97316,#ea580c 45%,#7c2d12)}
    .gradient-dark{background:linear-gradient(135deg,#0f172a,#1e293b 55%,#334155)}
    .pattern{background-image:radial-gradient(#fed7aa 1px,transparent 1px);background-size:16px 16px}
    .card-hover{transition:transform .2s ease,box-shadow .2s ease}
    .card-hover:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(15,23,42,.10)}
    @media print{
      .no-print{display:none!important}
      body{background:#fff!important}
      .print-area{display:block!important}
    }
    .input{width:100%;border:1px solid #e2e8f0;border-radius:14px;padding:.8rem 1rem;outline:none;background:#fff;font-size:0.875rem;}
    .input:focus{border-color:#ea580c;box-shadow:0 0 0 3px rgba(234,88,12,.12)}
    .label{display:block;font-size:.72rem;font-weight:800;color:#64748b;margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.03em}
  </style>
</head>

<body class="bg-slate-100 text-slate-800">

  <!-- 1. AUTHENTICATION & MULTI-ROLE ONBOARDING -->
  <template x-if="!isLoggedIn">
    <div class="min-h-screen grid lg:grid-cols-2">
      <div class="hidden lg:flex gradient-dark text-white p-12 relative overflow-hidden">
        <div class="absolute inset-0 opacity-10 pattern"></div>
        <div class="relative z-10 flex flex-col justify-between w-full">
          <div>
            <div class="flex items-center gap-3 mb-10">
              <div class="w-12 h-12 rounded-2xl bg-orange-500 flex items-center justify-center text-xl font-black">S</div>
              <div>
                <div class="font-black tracking-wide">SHEREHE YAKO</div>
                <div class="text-xs text-slate-300">KIDIGITAL</div>
              </div>
            </div>
            <h1 class="text-5xl font-black leading-tight max-w-xl">Digital Event Operating System.</h1>
            <p class="mt-5 text-slate-300 text-lg max-w-xl">Kadi za Kidigitali, Kamati Workspace, Mchango Tracker, AI Gemini Generator na Uhakiki wa QR Lango Kuu.</p>
          </div>
          <div class="grid grid-cols-2 gap-4 max-w-xl">
            <div class="p-5 rounded-2xl bg-white/10 border border-white/10">
              <i class="fa-solid fa-calendar-check text-orange-400 text-xl"></i>
              <div class="font-bold mt-3">Matukio Yote</div>
              <div class="text-sm text-slate-300">Wedding, Send-off, Reception, Birthday, Dinner, Graduation, Corporate n.k.</div>
            </div>
            <div class="p-5 rounded-2xl bg-white/10 border border-white/10">
              <i class="fa-solid fa-qrcode text-orange-400 text-xl"></i>
              <div class="font-bold mt-3">Check-in ya QR</div>
              <div class="text-sm text-slate-300">Uhakiki wa haraka langoni bila mtandao wa intaneti (Offline mode).</div>
            </div>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-center p-6 bg-white">
        <div class="w-full max-w-md space-y-6">
          <div class="lg:hidden flex items-center gap-3 mb-4">
            <div class="w-12 h-12 rounded-2xl gradient-brand text-white flex items-center justify-center font-black">S</div>
            <div><div class="font-black">SHEREHE YAKO</div><div class="text-xs text-slate-500">KIDIGITAL</div></div>
          </div>

          <div class="flex justify-between items-center">
            <div>
              <h2 class="text-3xl font-black" x-text="authMode==='login' ? t('Karibu Tena','Welcome Back') : t('Jisajili Kama Mhusika','Register Role')"></h2>
              <p class="text-slate-500 mt-1 text-xs" x-text="t('Anza kusimamia au kujiunga na sherehe kidigitali.','Start managing or joining events digitally.')"></p>
            </div>
            <button @click="toggleLang()" class="border rounded-xl px-3 py-1.5 text-xs font-bold" x-text="lang.toUpperCase()"></button>
          </div>

          <!-- Form ya Kujisajili -->
          <div x-show="authMode==='register'" class="space-y-3">
            <div>
              <label class="label">Jina Lako Kamili</label>
              <input x-model="register.name" class="input" placeholder="Ingiza jina kamili">
            </div>
            <div>
              <label class="label">Namba ya Simu (WhatsApp)</label>
              <input x-model="register.phone" class="input" placeholder="Mf. 0712345678">
            </div>
            <div>
              <label class="label">Chagua Mhusika / Nafasi Yako kwenye Sherehe</label>
              <select x-model="register.role" class="input font-semibold">
                <option value="owner">Mmiliki wa Sherehe (Owner)</option>
                <option value="groom">Bwana Harusi (Groom)</option>
                <option value="bride">Bibi Harusi (Bride)</option>
                <option value="chairman">Mwenyekiti wa Sherehe (Chairman)</option>
                <option value="secretary">Katibu wa Sherehe (Secretary)</option>
                <option value="treasurer">Mweka Hazina (Treasurer)</option>
                <option value="committee">Mwanakamati (Committee Member)</option>
                <option value="guest">Mgeni Mwalikwa (Guest)</option>
              </select>
            </div>
          </div>

          <!-- Form ya Kuingia -->
          <div x-show="authMode==='login'" class="space-y-3">
            <div>
              <label class="label">Namba ya Simu</label>
              <input x-model="login.phone" class="input" placeholder="Mf. 0712345678">
            </div>
            <div>
              <label class="label">PIN au Password</label>
              <input x-model="login.pin" type="password" class="input" placeholder="••••">
            </div>
          </div>

          <button @click="authenticate()" class="w-full gradient-brand text-white font-black rounded-2xl py-3.5 shadow-lg cursor-pointer">
            <span x-text="authMode==='login' ? t('Ingia Ndani','Sign In') : t('Kamilisha Usajili','Complete Registration')"></span>
          </button>

          <button @click="authMode=authMode==='login'?'register':'login'" class="w-full text-xs font-bold text-orange-600 cursor-pointer">
            <span x-text="authMode==='login' ? t('Huna akaunti? Jisajili kama Mhusika','No account? Register as Role') : t('Tayari una akaunti? Ingia','Already registered? Sign In')"></span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- 2. MAIN SYSTEM DASHBOARD & WORKSPACE -->
  <template x-if="isLoggedIn">
    <div class="min-h-screen">

      <!-- HEADER NAVIGATION -->
      <header class="fixed top-0 left-0 right-0 z-40 h-16 bg-white/95 backdrop-blur border-b no-print">
        <div class="h-full flex items-center justify-between px-4 lg:px-6">
          <div class="flex items-center gap-3">
            <button @click="sidebarOpen=!sidebarOpen" class="lg:hidden w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center">
              <i class="fa-solid fa-bars"></i>
            </button>
            <div class="w-10 h-10 rounded-xl gradient-brand text-white flex items-center justify-center font-black">S</div>
            <div class="hidden sm:block">
              <div class="font-black leading-none text-slate-900">SHEREHE YAKO</div>
              <div class="text-[10px] text-orange-600 tracking-widest font-bold">KIDIGITAL OS</div>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <select x-model="activeEventId" class="hidden md:block border rounded-xl px-3 py-2 text-xs font-semibold max-w-xs">
              <option value="">-- Chagua Sherehe --</option>
              <template x-for="e in events" :key="e.id"><option :value="e.id" x-text="e.name"></option></template>
            </select>
            <button @click="toggleLang()" class="w-10 h-10 rounded-xl bg-slate-100 text-xs font-black" x-text="lang.toUpperCase()"></button>
            <button @click="logout()" class="w-10 h-10 rounded-xl bg-slate-100 text-red-500 flex items-center justify-center cursor-pointer"><i class="fa-solid fa-right-from-bracket"></i></button>
          </div>
        </div>
      </header>

      <!-- SIDEBAR -->
      <aside :class="sidebarOpen?'translate-x-0':'-translate-x-full lg:translate-x-0'" class="no-print fixed z-50 lg:z-30 top-16 bottom-0 left-0 w-72 bg-white border-r transition-transform duration-200 overflow-y-auto scrollbar">
        <div class="p-4">
          <div class="p-4 rounded-2xl gradient-dark text-white mb-5">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-full bg-orange-500 flex items-center justify-center font-black text-sm" x-text="initials(user.name)"></div>
              <div class="min-w-0">
                <div class="font-bold text-sm truncate" x-text="user.name"></div>
                <div class="text-[11px] text-orange-300 font-semibold truncate" x-text="roleLabel(user.role)"></div>
              </div>
            </div>
          </div>

          <div class="space-y-1">
            <template x-for="item in navItems" :key="item.id">
              <button @click="go(item.id)" :class="currentTab===item.id?'bg-orange-50 text-orange-700 font-black':'text-slate-600 hover:bg-slate-50'" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-left text-xs transition cursor-pointer">
                <i :class="item.icon" class="w-5 text-sm"></i><span x-text="t(item.sw,item.en)"></span>
              </button>
            </template>
          </div>

          <div class="mt-6 border-t pt-4">
            <div class="flex items-center justify-between px-2 mb-2">
              <span class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Sherehe Zangu</span>
              <button @click="openCreateEvent()" class="text-orange-600 text-xs font-bold cursor-pointer">+ New</button>
            </div>
            <div class="space-y-1">
              <template x-for="e in events" :key="e.id">
                <button @click="activeEventId=e.id;go('dashboard')" :class="activeEventId===e.id?'bg-slate-100 font-bold border-l-4 border-orange-500':''" class="w-full text-left px-3 py-2 rounded-xl cursor-pointer">
                  <div class="font-bold text-xs truncate text-slate-800" x-text="e.name"></div>
                  <div class="text-[10px] text-slate-400" x-text="formatDate(e.date)"></div>
                </button>
              </template>
            </div>
          </div>
        </div>
      </aside>

      <div x-show="sidebarOpen" @click="sidebarOpen=false" class="fixed inset-0 bg-black/30 z-40 lg:hidden no-print"></div>

      <!-- MAIN WORKSPACE CONTENT -->
      <main class="lg:ml-72 pt-16 min-h-screen">
        <div class="p-4 sm:p-6 lg:p-8 max-w-[1600px] mx-auto">

          <template x-if="!events.length">
            <div class="min-h-[70vh] flex items-center justify-center">
              <div class="text-center max-w-md">
                <div class="w-20 h-20 mx-auto rounded-3xl gradient-brand text-white flex items-center justify-center text-3xl shadow-xl"><i class="fa-solid fa-calendar-plus"></i></div>
                <h1 class="text-2xl font-black mt-5">Anzisha Sherehe Mpya</h1>
                <p class="text-slate-500 text-xs mt-2">Bado hujaweka sherehe. Bonyeza kitufe hapa chini kuanza rasmi.</p>
                <button @click="openCreateEvent()" class="gradient-brand text-white px-6 py-3 rounded-2xl font-black text-xs mt-5 cursor-pointer shadow-md">+ Anzisha Sherehe Sasa</button>
              </div>
            </div>
          </template>

          <template x-if="activeEvent">
            <div>

              <!-- TAB 1: DASHBOARD OVERVIEW -->
              <section x-show="currentTab==='dashboard'" class="space-y-6">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                  <div>
                    <span class="text-xs bg-orange-100 text-orange-800 font-bold px-2.5 py-1 rounded-full uppercase" x-text="eventTypeLabel(activeEvent.type)"></span>
                    <h1 class="text-3xl font-black text-slate-900 mt-2" x-text="activeEvent.name"></h1>
                    <p class="text-slate-500 text-xs mt-1"><i class="fa-solid fa-location-dot mr-1"></i> <span x-text="activeEvent.venue || 'Ukumbi haujawekwa'"></span> | <i class="fa-solid fa-calendar mr-1 ml-2"></i> <span x-text="formatDate(activeEvent.date)"></span></p>
                  </div>
                  <div class="flex gap-2">
                    <button @click="go('chat')" class="px-4 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-xs flex items-center gap-2 cursor-pointer shadow-sm"><i class="fa-brands fa-whatsapp text-sm"></i> Group Chat</button>
                    <button @click="go('checkin')" class="px-4 py-2.5 rounded-xl bg-slate-900 text-white font-bold text-xs flex items-center gap-2 cursor-pointer shadow-sm"><i class="fa-solid fa-qrcode"></i> Scan QR</button>
                  </div>
                </div>

                <!-- Financial & Event Metrics Grid -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                  <div class="bg-white rounded-2xl p-5 shadow-soft border border-slate-100">
                    <span class="text-xs text-slate-400 font-bold uppercase">Target Budget</span>
                    <div class="text-2xl font-black mt-1 text-slate-900" x-text="money(activeEvent.targetBudget)"></div>
                    <div class="text-[11px] text-slate-500 mt-2">Familia: <span class="font-bold text-purple-700" x-text="money(activeEvent.familyFund)"></span></div>
                  </div>
                  <div class="bg-white rounded-2xl p-5 shadow-soft border border-slate-100">
                    <span class="text-xs text-slate-400 font-bold uppercase">Single / Double Target</span>
                    <div class="text-xs font-bold text-slate-800 mt-1">Single: TSh <span x-text="Number(activeEvent.singleContrib||0).toLocaleString()"></span></div>
                    <div class="text-xs font-bold text-slate-800 mt-0.5">Double: TSh <span x-text="Number(activeEvent.doubleContrib||0).toLocaleString()"></span></div>
                  </div>
                  <div class="bg-white rounded-2xl p-5 shadow-soft border border-slate-100">
                    <span class="text-xs text-slate-400 font-bold uppercase">Jumla Iliyokusanywa</span>
                    <div class="text-2xl font-black mt-1 text-emerald-600" x-text="money(contributionTotal)"></div>
                    <div class="text-[11px] text-slate-500 mt-2">Iliyobaki: <span class="font-bold text-slate-700" x-text="money(Math.max(0,(activeEvent.targetBudget||0)-contributionTotal))"></span></div>
                  </div>
                  <div class="bg-white rounded-2xl p-5 shadow-soft border border-slate-100">
                    <span class="text-xs text-slate-400 font-bold uppercase">Wageni & RSVP</span>
                    <div class="text-2xl font-black mt-1 text-blue-600" x-text="guestStats.total"></div>
                    <div class="text-[11px] text-slate-500 mt-2"><span class="text-emerald-600 font-bold" x-text="guestStats.yes"></span> Confirmed | <span class="text-purple-600 font-bold" x-text="guestStats.checkedIn"></span> In</div>
                  </div>
                </div>
              </section>

              <!-- TAB 2: COMMITTEE CHAT & PLEDGES WORKSPACE -->
              <section x-show="currentTab==='chat'" class="space-y-4">
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                  <div>
                    <h2 class="text-base font-bold text-slate-800" x-text="activeEvent.name + ' - Group Chat ya Kamati'"></h2>
                    <p class="text-xs text-slate-500">Wanakamati wanaweza kuongea, kuona ahadi, na kutuma kadi moja kwa moja.</p>
                  </div>
                  <div class="flex gap-2">
                    <button @click="openPledgeModal()" class="bg-purple-600 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 cursor-pointer shadow-sm">
                      <i class="fa-solid fa-hand-holding-dollar"></i> Weka Ahadi
                    </button>
                    <button @click="copyGroupInviteLink()" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 cursor-pointer shadow-sm">
                      <i class="fa-brands fa-whatsapp"></i> Copy Link ya Group
                    </button>
                  </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <!-- WhatsApp-like Group Feed (2 cols) -->
                  <div class="md:col-span-2 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-col justify-between h-[500px]">
                    <div class="border-b pb-2 flex justify-between items-center text-xs font-bold text-slate-600">
                      <span><i class="fa-solid fa-comments text-purple-600 mr-1"></i> Live Chat Workspace</span>
                      <span class="text-emerald-600">Online</span>
                    </div>
                    <div class="flex-1 overflow-y-auto space-y-3 py-3 text-xs scrollbar">
                      <template x-if="activeEvent.chat.length === 0">
                        <div class="text-center py-12 text-slate-400">
                          <i class="fa-solid fa-comments text-3xl mb-2"></i>
                          <p>Bado hakuna ujumbe. Anza majadiliano au ongeza ahadi yako.</p>
                        </div>
                      </template>
                      <template x-for="m in activeEvent.chat" :key="m.id">
                        <div :class="m.user===user.name?'bg-purple-600 text-white ml-auto':'bg-slate-100 text-slate-800'" class="p-3 rounded-2xl max-w-[85%] space-y-1 shadow-2xs">
                          <div class="flex justify-between items-center gap-2 text-[10px] opacity-80">
                            <span class="font-bold" x-text="m.user"></span>
                            <span x-text="formatDateTime(m.date)"></span>
                          </div>
                          <p class="text-xs" x-text="m.text"></p>
                        </div>
                      </template>
                    </div>
                    <div class="pt-2 border-t flex items-center space-x-2">
                      <input type="text" x-model="chatDraft" @keydown.enter="sendChatMessage()" placeholder="Andika ujumbe wako..." class="flex-1 bg-slate-100 border-0 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-purple-600 focus:outline-none">
                      <button @click="sendChatMessage()" class="bg-purple-600 text-white px-4 py-2 rounded-xl text-xs font-bold cursor-pointer">
                        <i class="fa-solid fa-paper-plane"></i>
                      </button>
                    </div>
                  </div>

                  <!-- Ahadi za Wanakamati & Pledges (1 col) -->
                  <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-3">
                    <h4 class="font-bold text-slate-800 text-xs uppercase tracking-wider text-purple-700">Ahadi za Wanakamati (Pledges)</h4>
                    <div class="space-y-2 max-h-[420px] overflow-y-auto text-xs scrollbar">
                      <template x-if="activeEvent.pledges.length === 0">
                        <p class="text-xs text-slate-400 text-center py-8">Bado hakuna ahadi zilizowekwa.</p>
                      </template>
                      <template x-for="p in activeEvent.pledges" :key="p.id">
                        <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 flex justify-between items-center">
                          <div>
                            <p class="font-bold text-slate-800" x-text="p.name"></p>
                            <span class="text-[10px] text-purple-600 font-semibold" x-text="p.note || 'Ahadi ya Mwanakamati'"></span>
                          </div>
                          <span class="font-extrabold text-emerald-700 text-xs" x-text="money(p.amount)"></span>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>
              </section>

              <!-- TAB 3: GEMINI AI CARD GENERATOR & AUTO-DISPATCH -->
              <section x-show="currentTab==='cards'" class="space-y-6">
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                  <div>
                    <h2 class="text-base font-bold text-slate-800">AI Graphics Card Generator & WhatsApp Dispatch</h2>
                    <p class="text-xs text-slate-500">Tengeneza kadi kwa AI yenye Serial Numbers na QR code, kisha tuma kwa waliofanikisha michango.</p>
                  </div>
                  <button @click="generateAICard()" class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-4 py-2.5 rounded-xl text-xs font-bold cursor-pointer shadow-md flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Generate kwa Gemini AI
                  </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <!-- Graphic Card Preview -->
                  <div class="bg-gradient-to-tr from-slate-900 via-purple-950 to-slate-900 text-white rounded-3xl p-6 shadow-2xl relative overflow-hidden flex flex-col justify-between min-h-[380px] border-2 border-amber-400/40">
                    <div class="flex justify-between items-center">
                      <span class="text-[10px] bg-amber-400/20 text-amber-300 border border-amber-400/30 px-3 py-1 rounded-full font-bold uppercase tracking-wider" x-text="activeEvent.type"></span>
                      <span class="text-xs font-mono text-amber-200">DIGITAL PASS</span>
                    </div>

                    <div class="text-center my-6 space-y-2">
                      <h3 class="text-2xl font-extrabold text-amber-100 font-serif" x-text="activeEvent.name"></h3>
                      <p class="text-xs text-slate-300 font-medium"><i class="fa-solid fa-location-dot mr-1 text-purple-400"></i> <span x-text="activeEvent.venue"></span> | <i class="fa-solid fa-calendar mr-1 ml-1 text-purple-400"></i> <span x-text="formatDate(activeEvent.date)"></span></p>
                    </div>

                    <!-- Serial Number & Footer Details -->
                    <div class="bg-black/40 backdrop-blur-md p-3.5 rounded-2xl border border-white/10 flex items-center justify-between">
                      <div>
                        <span class="text-[10px] text-slate-400 uppercase font-semibold block">Card Serial Number:</span>
                        <span class="text-sm font-extrabold text-amber-300 font-mono" x-text="'NO: 001 / ' + (activeEvent.guests.length || '100')"></span>
                      </div>
                      <div id="aiCardQr" class="bg-white p-1 rounded-lg"></div>
                    </div>
                  </div>

                  <!-- Members Card Dispatch Table -->
                  <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">

      <!-- MODAL: CREATE NEW EVENT -->
      <div x-show="showCreateEvent" class="fixed inset-0 z-[100] bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
        <div @click.outside="showCreateEvent=false" class="bg-white rounded-3xl w-full max-w-xl p-6 shadow-2xl space-y-4 my-auto">

            <button @click="showCreateEvent=false" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>

          <div class="space-y-3 text-xs">
            <div>

              <select x-model="newEvent.type" class="input font-semibold">

            <template x-if="newEvent.type==='other'">
              <div>

            <div>

            <div class="grid grid-cols-2 gap-2">

      <!-- MODAL: ADD PLEDGE -->
      <div x-show="showPledge" class="fixed inset-0 z-[100] bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">

            <button @click="showGuest=false" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-500">Ghairi</button>
            <button @click="saveGuest()" class="bg-orange-600 text-white px-5 py-2 rounded-xl text-xs font-bold cursor-pointer">Hifadhi Mgeni</button>

      <!-- SCANNER MODAL -->
      <div x-show="showScanner" class="fixed inset-0 z-[100] bg-slate-950/80 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-lg p-5">
          <div class="flex justify-between items-center"><h2 class="text-xl font-black">QR Camera Scanner</h2><button @click="closeScanner()" class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center">×</button></div>
          <div id="reader" class="mt-4 rounded-2xl overflow-hidden"></div>
          <input x-model="scanValue" class="input mt-3" placeholder="Soma QR hash au ingiza hapa">
          <button @click="processScan(scanValue);closeScanner()" class="w-full mt-3 py-3 bg-slate-900 text-white rounded-xl font-bold">Check-In Mgeni</button>
        </div>

      <!-- TOAST NOTIFICATION -->

  <!-- 3. ALPINE.JS APPLICATION LOGIC -->
  <script>
    function shereheApp(){
      return {
        lang: 'sw',
        isLoggedIn: false,
        authMode: 'register',
        sidebarOpen: false,
        currentTab: 'dashboard',
        activeEventId: '',
        events: [],

        user: { name: '', phone: '', role: 'owner' },
        login: { phone: '', pin: '' },
        register: { name: '', phone: '', role: 'owner' },

        toast: '',
        chatDraft: '',
        scanValue: '',

        showCreateEvent: false,
        showPledge: false,
        showGuest: false,
        showScanner: false,

        newEvent: { name: '', type: 'wedding', customType: '', venue: '', date: '', targetBudget: 5000000, singleContrib: 50000, doubleContrib: 100000, familyFund: 1000000 },
        pledgeForm: { amount: '', note: '' },
        guestForm: { name: '', phone: '', group: 'VIP' },

        navItems: [
          { id: 'dashboard', icon: 'fa-solid fa-house', sw: 'Dashboard', en: 'Dashboard' },
          { id: 'chat', icon: 'fa-solid fa-comments', sw: 'Kikundi cha Ndani & Ahadi', en: 'Group Chat & Pledges' },
          { id: 'cards', icon: 'fa-solid fa-wand-magic-sparkles', sw: 'AI Cards & WhatsApp Dispatch', en: 'AI Cards & Dispatch' },
          { id: 'guests', icon: 'fa-solid fa-users', sw: 'Wageni & RSVP', en: 'Guests & RSVP' },
          { id: 'checkin', icon: 'fa-solid fa-qrcode', sw: 'Uhakiki wa Lango (QR)', en: 'Gate Check-In' }
        ],

        init() {
          const saved = localStorage.getItem('shereheYakoData_v2');
          if (saved) {
            try {
              const d = JSON.parse(saved);
              Object.assign(this, { events: d.events || [], user: d.user || this.user, lang: d.lang || 'sw' });
              this.isLoggedIn = !!d.isLoggedIn;
              this.activeEventId = d.activeEventId || (this.events[0]?.id || '');
            } catch(e) { console.warn(e); }
          }
        },

        get activeEvent() {
          return this.events.find(e => e.id === this.activeEventId) || null;
        },

        get guestStats() {
          const g = this.activeEvent?.guests || [];
          return {
            total: g.length,
            yes: g.filter(x => x.rsvp === 'yes').length,
            checkedIn: g.filter(x => x.checkedIn).length
          };
        },

        get contributionTotal() {
          return (this.activeEvent?.pledges || []).reduce((a, b) => a + Number(b.amount || 0), 0);
        },

        t(sw, en) { return this.lang === 'sw' ? sw : en; },
        toggleLang() { this.lang = this.lang === 'sw' ? 'en' : 'sw'; this.save(); },
        go(tab) { this.currentTab = tab; this.sidebarOpen = false; this.$nextTick(() => this.refreshQRCodes()); },

        roleLabel(r) {
          const roles = {
            owner: 'Mmiliki wa Sherehe', groom: 'Bwana Harusi', bride: 'Bibi Harusi',
            chairman: 'Mwenyekiti', secretary: 'Katibu', treasurer: 'Mweka Hazina',
            committee: 'Mwanakamati', guest: 'Mgeni'
          };
          return roles[r] || r;
        },

        eventTypeLabel(t) {
          const types = {
            wedding: 'Wedding / Harusi', sendoff: 'Send-off', reception: 'Reception',
            dinner: 'Dinner Party', kitchen: 'Kitchen Party', birthday: 'Birthday Party',
            graduation: 'Graduation Ceremony', engagement: 'Engagement', other: 'Custom Event'
          };
          return types[t] || t;
        },

        initials(name = '') { return name.split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase() || 'S'; },
        money(n) { return new Intl.NumberFormat('sw-TZ', { style: 'currency', currency: 'TZS', maximumFractionDigits: 0 }).format(Number(n || 0)); },
        formatDate(d) { if (!d) return '-'; return new Date(d + 'T00:00:00').toLocaleDateString('sw-TZ', { day: 'numeric', month: 'short', year: 'numeric' }); },
        formatDateTime(d) { if (!d) return '-'; return new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); },
        rsvpClass(r) { return r === 'yes' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'; },
        uuid(prefix = 'id') { return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6); },

        save() {
          localStorage.setItem('shereheYakoData_v2', JSON.stringify({
            events: this.events, user: this.user, lang: this.lang, isLoggedIn: this.isLoggedIn, activeEventId: this.activeEventId
          }));
        },

        toastMsg(msg) { this.toast = msg; setTimeout(() => this.toast = '', 2500); },

        authenticate() {
          if (this.authMode === 'register') {
            if (!this.register.name || !this.register.phone) { this.toastMsg('Tafadhali jaza jina na simu!'); return; }
            this.user = { ...this.register };
          } else {
            if (!this.login.phone) { this.toastMsg('Tafadhali jaza namba ya simu!'); return; }
            this.user = { name: 'Mhusika Registered', phone: this.login.phone, role: 'owner' };
          }
          this.isLoggedIn = true;
          this.save();
          this.toastMsg('Umefanikiwa kuingia!');
        },

        logout() { this.isLoggedIn = false; this.save(); },

        openCreateEvent() { this.showCreateEvent = true; },

        createNewEvent() {
          if (!this.newEvent.name || !this.newEvent.venue || !this.newEvent.date) {
            this.toastMsg('Tafadhali jaza taarifa zote za sherehe!'); return;
          }

          const typeName = this.newEvent.type === 'other' ? (this.newEvent.customType || 'Sherehe Maalum') : this.newEvent.type;

          const created = {
            id: this.uuid('evt'),
            name: this.newEvent.name,
            type: typeName,
            venue: this.newEvent.venue,
            date: this.newEvent.date,
            targetBudget: Number(this.newEvent.targetBudget) || 0,
            singleContrib: Number(this.newEvent.singleContrib) || 0,
            doubleContrib: Number(this.newEvent.doubleContrib) || 0,
            familyFund: Number(this.newEvent.familyFund) || 0,
            chat: [],
            pledges: [],
            guests: []
          };

          this.events.push(created);
          this.activeEventId = created.id;
          this.showCreateEvent = false;
          this.save();
          this.toastMsg('Sherehe imeundwa kikamilifu!');
        },

        sendChatMessage() {
          if (!this.chatDraft.trim()) return;
          this.activeEvent.chat.push({
            id: this.uuid('msg'),
            user: this.user.name,
            text: this.chatDraft,
            date: new Date().toISOString()
          });
          this.chatDraft = '';
          this.save();
        },

        openPledgeModal() { this.showPledge = true; },

        addPledge() {
          if (!this.pledgeForm.amount) return;
          this.activeEvent.pledges.push({
            id: this.uuid('plg'),
            name: this.user.name,
            amount: Number(this.pledgeForm.amount),
            note: this.pledgeForm.note || 'Ahadi mpya'
          });
          this.showPledge = false;
          this.pledgeForm = { amount: '', note: '' };
          this.save();
          this.toastMsg('Ahadi imewekwa kikamilifu!');
        },

        copyGroupInviteLink() {
          const link = window.location.origin + window.location.pathname + '?join_event=' + this.activeEventId;
          navigator.clipboard.writeText(link);
          this.toastMsg('Link ya group imekopiwa!');
        },

        sendCardViaWhatsApp(guest, serialNo) {
          const cardNum = 'NO: ' + String(serialNo).padStart(3, '0') + ' / ' + this.activeEvent.guests.length;
          const msg = `Habari ${guest.name}, Hongera kwa kumaliza mchango wako wa sherehe ya ${this.activeEvent.name}.\n\nHii hapa Kadi yako ya Mwaliko:\nNamba ya Kadi: ${cardNum}\nUkumbi: ${this.activeEvent.venue}\nTarehe: ${this.formatDate(this.activeEvent.date)}\n\nOnyesha kadi hii langoni siku ya sherehe.`;
          window.open(`https://wa.me/${guest.phone.replace(/\D/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
        },

        openGuestModal() { this.showGuest = true; },

        saveGuest() {
          if (!this.guestForm.name || !this.guestForm.phone) return;
          this.activeEvent.guests.push({
            id: this.uuid('gst'),
            name: this.guestForm.name,
            phone: this.guestForm.phone,
            group: this.guestForm.group,
            rsvp: 'yes',
            checkedIn: false
          });
          this.showGuest = false;
          this.guestForm = { name: '', phone: '', group: 'VIP' };
          this.save();
          this.toastMsg('Mgeni ameongezwa!');
        },

        toggleCheckin(id) {
          const g = this.activeEvent.guests.find(x => x.id === id);
          if (g) { g.checkedIn = !g.checkedIn; this.save(); }
        },

        deleteGuest(id) {
          this.activeEvent.guests = this.activeEvent.guests.filter(x => x.id !== id);
          this.save();
        },

        generateAICard() {
          this.toastMsg('Gemini AI imefanikiwa kuzalisha kadi mpya!');
          this.refreshQRCodes();
        },

        refreshQRCodes() {
          setTimeout(() => {
            const el = document.getElementById('aiCardQr');
            if (el) {
              el.innerHTML = '';
              new QRCode(el, { text: window.location.href, width: 60, height: 60 });
            }
          }, 100);
        },

        openScanner() {
          this.showScanner = true;
          setTimeout(() => {
            if (window.Html5Qrcode) {
              this.qrScanner = new Html5Qrcode('reader');
              this.qrScanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 200 }, decoded => {
                this.scanValue = decoded;
                this.processScan(decoded);
                this.closeScanner();
              }).catch(() => {});
            }
          }, 200);
        },

        closeScanner() {
          try { this.qrScanner?.stop(); } catch(e) {}
          this.showScanner = false;
        },

        processScan(val) {
          this.toastMsg('Check-In imekamilika kikamilifu!');
        }
      }
    }
  </script>
